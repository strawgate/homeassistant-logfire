[project]
name = "homeassistant-logfire"
version = "0.1.0"
description = "Export Home Assistant telemetry directly to Pydantic Logfire"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = [
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-sdk==1.44.0",
]

[dependency-groups]
core-test = [
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.0",
]
homeassistant-test = [
  "homeassistant==2026.8.3",
  "pytest-homeassistant-custom-component==0.13.357",
]
fixture-tools = [
  "websockets>=17.0,<18",
]
lint = [
  "ruff>=0.12.0",
]
dev = [
  { include-group = "core-test" },
  { include-group = "fixture-tools" },
  { include-group = "homeassistant-test" },
  { include-group = "lint" },
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
